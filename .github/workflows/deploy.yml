name: Deploy to UCF Maverick

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up SSH key
        env:
          MAVERICK_KEY: ${{ secrets.MAVERICK_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$MAVERICK_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H 10.173.204.134 >> ~/.ssh/known_hosts

      - name: Deploy files to maverick
        run: |
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            index.html \
            ${{ secrets.MAVERICK_USER }}@10.173.204.134:/var/www/html/seniordesign/fa2026sp2027/g12/

      - name: Deploy PDFs if present
        run: |
          for f in *.pdf; do
            [ -f "$f" ] || continue
            scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
              "$f" \
              ${{ secrets.MAVERICK_USER }}@10.173.204.134:/var/www/html/seniordesign/fa2026sp2027/g12/
          done

      - name: Deploy images if present
        run: |
          for f in *.png *.jpg *.gif; do
            [ -f "$f" ] || continue
            scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
              "$f" \
              ${{ secrets.MAVERICK_USER }}@10.173.204.134:/var/www/html/seniordesign/fa2026sp2027/g12/
          done